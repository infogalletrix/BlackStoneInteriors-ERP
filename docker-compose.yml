version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: blackstone_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: StrongPassword123!
      MYSQL_DATABASE: blackstone_interior
      MYSQL_USER: blackstone_user
      MYSQL_PASSWORD: StrongPassword123!
    ports:
      - "3311:3306"
    volumes:
      - blackstone_db_data:/var/lib/mysql

  backend:
    build: 
      context: ./server/Blackstone_Interior
      dockerfile: Dockerfile
    container_name: blackstone_backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=server=db;port=3306;database=blackstone_interior;user=blackstone_user;password=StrongPassword123!;
    ports:
      - "5051:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: blackstone_frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  blackstone_db_data:
